"""

[security]
# Maximum requests per minute per API key. 0 = unlimited.
rate_limit_rpm = 60
# Auto-generate a key on first boot if none exist.
auto_generate_key = true

[backend]
# Default backend type: "ollama" or "llamacpp"
default_type = "ollama"
# Base URL of your Ollama instance.
ollama_base_url = "http://127.0.0.1:11434"
# Base URL of your llama.cpp server (if used).
llamacpp_base_url = "http://127.0.0.1:8080"

# Model registry. Add any model you want Aegis to know about.
# vram_gb is the approximate VRAM this model uses when loaded at default quant.
# backend overrides the default_type for this specific model.
[models.registry]

  [models.registry."llama3:8b"]
  vram_gb = 5.5
  backend = "ollama"
  description = "Meta Llama 3 8B - fast, general purpose"
  system_prompt = """
Llama 3 8B addendum: prioritize balanced general-purpose assistance. Be conversational but concise, ask clarifying questions when requirements are ambiguous, and favor robust step-by-step reasoning for architecture and debugging tasks.
  """

  [models.registry."deepseek-coder:6.7b"]
  vram_gb = 4.2
  backend = "ollama"
  description = "DeepSeek Coder 6.7B - optimized for code generation"
  system_prompt = """
DeepSeek Coder 6.7B addendum: lean into implementation detail, code review precision, static reasoning, test design, and edge-case analysis. Prefer concrete diffs, typed APIs, small abstractions, and compiler-verifiable suggestions.
  """

  [models.registry."phi3:mini"]
  vram_gb = 2.3
  backend = "ollama"
  description = "Phi-3 Mini - lightweight fallback for low VRAM"
  system_prompt = """
Phi-3 Mini addendum: optimize for short, high-signal answers. State assumptions clearly, avoid long speculative chains, and prefer small actionable steps that fit limited context and compute budgets.
  """
